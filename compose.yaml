name: photohearth
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PHOTOHEARTH_ORIGINS: https://${PHOTOHEARTH_DOMAIN:-photos.home.arpa}
      PHOTOHEARTH_SECURE_COOKIE: "true"
    volumes:
      - ${PHOTOHEARTH_STORAGE:-photohearth_data}:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PHOTOHEARTH_DOMAIN: ${PHOTOHEARTH_DOMAIN:-photos.home.arpa}
    ports:
      - "${PHOTOHEARTH_BIND_IP:-127.0.0.1}:80:80"
      - "${PHOTOHEARTH_BIND_IP:-127.0.0.1}:443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  photohearth_data:
  caddy_data:
  caddy_config:
