services:
  gateway:
    ports:
      - "${PHOTOHEARTH_BIND_IP:-127.0.0.1}:8443:8443"
    volumes:
      - ./deploy/Caddyfile-ci:/etc/caddy/Caddyfile:ro
  jenkins:
    build: ./deploy/jenkins
    restart: unless-stopped
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Xms256m -Xmx768m
      JENKINS_PUBLIC_URL: https://${PHOTOHEARTH_DOMAIN:-photos.home.arpa}:8443/
    volumes:
      - jenkins_home:/var/jenkins_home
      - agent_config:/agent-config
    secrets: [jenkins_password]
    mem_limit: 1536m
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  ci-agent:
    build:
      context: ./deploy/jenkins
      dockerfile: agent.Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      jenkins:
        condition: service_started
      ci-db:
        condition: service_healthy
    environment:
      PHOTOHEARTH_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-not-production@ci-db:5432/photohearth_test
    networks: [default, ci_storage]
    volumes:
      - agent_work:/home/jenkins/agent
      - agent_config:/agent-config:ro
    shm_size: 256m
    mem_limit: 3g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  ci-db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: photohearth_test
      POSTGRES_PASSWORD: ci-only-not-production
    tmpfs:
      - /var/lib/postgresql/data:size=256m
    networks: [ci_storage]
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d photohearth_test"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  jenkins_home:
  agent_config:
  agent_work:
secrets:
  jenkins_password:
    file: ./data/deployment/jenkins-password
networks:
  ci_storage:
    internal: true
